<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8" /><title>Registro do formulário de confirmação</title></head>
  <body>
    <form name="confirmacao" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="confirmacao" />
      <input name="nome" />
      <input name="email" type="email" />
      <input name="telefone" />
      <input name="adultos" />
      <input name="criancas" />
      <textarea name="observacoes"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
